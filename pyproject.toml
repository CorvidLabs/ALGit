[project]
name = "algit"
version = "0.1.0"
description = "Push a git repository to Algorand LocalNet and read it on your machine."
requires-python = ">=3.11"
dependencies = ["py-algorand-sdk>=2.12,<2.13"]

[project.scripts]
algit = "algit.command:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["py"]
